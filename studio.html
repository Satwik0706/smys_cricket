<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Poster Studio — T20 Cricket Mega Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <!-- ============================================================ -->
  <!-- POSTER STUDIO (DEDICATED PORTAL)                             -->
  <!-- ============================================================ -->
  <main id="viewPosterStudio" class="portal-view active">
    <header class="portal-top-bar" style="margin-bottom:24px;">
      <div class="brand-badge">
        <div class="brand-logo-icon">📸</div>
        <div>
          <div class="brand-title">CELEBRATION GRAPHICS STUDIO</div>
          <div class="brand-subtitle">Official 1080x1080 Social Media Announcement Graphics</div>
        </div>
      </div>
      <div class="portal-nav-actions">
        <button class="btn-exit-portal" onclick="window.location.href='index.html'">
          ← Exit to Gateway
        </button>
      </div>
    </header>

    <div style="max-width:800px; margin:0 auto; text-align:center;">
      <h2 style="color:var(--text-primary); font-size:1.8rem; font-weight:900; margin-bottom:8px;">
        High-Resolution Match Graphics Studio
      </h2>
      <p style="color:var(--text-secondary); margin-bottom:24px; font-size:0.9rem;">
        Official 1080x1080 celebration announcements rendered directly in your browser. Download and publish immediately across social channels.
      </p>

      <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <canvas id="studioPosterCanvas" width="1080" height="1080" style="max-width:440px; border-radius:18px; box-shadow:0 15px 40px rgba(0,0,0,0.12); border:2px solid var(--border-subtle);"></canvas>
      </div>

      <div style="display:flex; justify-content:center; gap:16px;">
        <button class="btn-primary" id="btnDownloadStudioPoster" style="max-width:320px;">
          Download 1080x1080 Poster (PNG)
        </button>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/audio.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
